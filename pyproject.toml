[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelforge"
version = "0.1.0"
description = "Local CloudTrail investigation workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.scripts]
sentinelforge = "sentinelforge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinelforge.frontend" = ["index.html"]
