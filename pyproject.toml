[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "riswan-ir"
version = "0.1.0"
description = "Local CloudTrail investigation workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "boto3>=1.40,<2", "PyYAML>=6.0.2,<7", "PyJWT>=2.10,<3"]

[project.urls]
Homepage = "https://riswanlabs.com/products/ir"
Repository = "https://github.com/riswan-labs/RiswanIR"
Issues = "https://github.com/riswan-labs/RiswanIR/issues"
Security = "https://github.com/riswan-labs/RiswanIR/security"

[project.optional-dependencies]
identity = ["PyJWT[crypto]>=2.10,<3"]
test = [
    "PyJWT[crypto]>=2.10,<3; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "moto[s3]>=5,<6; platform_system != 'Windows' or platform_machine != 'ARM64'",
]
quality = ["ruff>=0.11,<1", "mypy>=1.15,<3"]
security = ["bandit>=1.8,<2", "pip-audit>=2.9,<3"]

[project.scripts]
riswan-ir = "riswan_ir.__main__:main"
riswan-ir-evidence = "riswan_ir.evidence.cli:main"
riswan-ir-collect = "riswan_ir.connectors.cli:main"
riswan-ir-detect = "riswan_ir.detection.cli:main"
sentinelforge = "riswan_ir.__main__:main"
sentinelforge-evidence = "riswan_ir.evidence.cli:main"
sentinelforge-collect = "riswan_ir.connectors.cli:main"
sentinelforge-detect = "riswan_ir.detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"riswan_ir.frontend" = ["index.html", "*.svg"]
"riswan_ir.detection" = ["aws-rules.yml"]
"riswan_ir.correlation.temporal" = ["aws-rules.yml"]
"riswan_ir.risk" = ["default.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["riswan_ir", "riswan_platform", "riswan_security_data", "riswan_app"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/riswan_ir", "src/riswan_platform", "src/riswan_security_data", "src/riswan_app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "yaml.*"]
ignore_missing_imports = true
