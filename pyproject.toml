[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trailhound"
version = "0.1.0"
description = "TrailHound, an evidence-backed CloudTrail investigation workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "boto3>=1.40,<2"]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "moto[s3]>=5,<6; platform_system != 'Windows' or platform_machine != 'ARM64'",
]
quality = ["ruff>=0.11,<1", "mypy>=1.15,<3"]
security = ["bandit>=1.8,<2", "pip-audit>=2.9,<3"]

[project.scripts]
trailhound = "trailhound.__main__:main"
trailhound-evidence = "trailhound.evidence.cli:main"
trailhound-collect = "trailhound.connectors.cli:main"
sentinelforge = "trailhound.__main__:main"
sentinelforge-evidence = "trailhound.evidence.cli:main"
sentinelforge-collect = "trailhound.connectors.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trailhound.frontend" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["trailhound"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/trailhound"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
