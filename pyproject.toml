[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelforge"
version = "0.1.0"
description = "Local CloudTrail investigation workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]
quality = ["ruff>=0.11,<1", "mypy>=1.15,<3"]
security = ["bandit>=1.8,<2", "pip-audit>=2.9,<3"]

[project.scripts]
sentinelforge = "sentinelforge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinelforge.frontend" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["sentinelforge"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/sentinelforge"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
