name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: python -c "from importlib.resources import files; from sentinelforge import frontend; assert files(frontend).joinpath('index.html').is_file()"
