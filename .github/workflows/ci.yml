name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install ".[test]"
      - name: Run unit, integration, and security tests
        run: |
          mkdir -p reports
          python -m pytest tests/ -v --junitxml=reports/pytest.xml -o junit_family=xunit1 --cov=sentinelforge \
            --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=90
      - name: Verify installed browser asset
        run: python -c "from importlib.resources import files; from sentinelforge import frontend; from sentinelforge.correlation.temporal.registry import default_rules; from sentinelforge.detection.registry import default_registry; from sentinelforge.risk.registry import default_policy; assert files(frontend).joinpath('index.html').is_file(); assert len(default_registry().select()) >= 20; assert len(default_rules()) >= 10; assert default_policy().id == 'security-intelligence'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-and-coverage-reports
          path: reports/
          retention-days: 14
          if-no-files-found: error

  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install ".[quality]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - name: Validate GitHub Actions workflows
        run: |
          bash .github/scripts/install-scanner.sh actionlint
          "$RUNNER_TEMP/scanners/actionlint" -color
