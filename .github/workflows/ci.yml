name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install ".[test]"
      - name: Run architecture, contract, and application tests
        run: |
          mkdir -p reports
          python -m pytest tests/ -v --junitxml=reports/pytest.xml -o junit_family=xunit1 --cov \
            --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=90
      - name: Verify installed browser asset
        run: python -c "from importlib.resources import files; from riswan_ir import frontend; from riswan_ir.correlation.temporal.registry import default_rules; from riswan_ir.detection.registry import default_registry; from riswan_ir.risk.registry import default_policy; assert files(frontend).joinpath('index.html').is_file(); assert len(default_registry().select()) >= 20; assert len(default_rules()) >= 10; assert default_policy().id == 'security-intelligence'"
      - name: Build and smoke-test the local tool image
        run: |
          docker build --tag riswan-ir:ci .
          docker run --rm --entrypoint riswan-ir-evidence riswan-ir:ci --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-and-coverage-reports
          path: reports/
          retention-days: 14
          if-no-files-found: error

  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install ".[quality]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - name: Validate GitHub Actions workflows
        run: |
          bash .github/scripts/install-scanner.sh actionlint
          "$RUNNER_TEMP/scanners/actionlint" -color

  sdk-install:
    name: SDK install (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [base, aws, azure, gcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install and verify the selected SDK group
        env:
          SDK_GROUP: ${{ matrix.group }}
        run: |
          case "$SDK_GROUP" in
            base) python -m pip install . ;;
            aws|azure|gcp) python -m pip install ".[${SDK_GROUP}]" ;;
            *) exit 1 ;;
          esac
          python -m pip check
          python -c "import riswan_app.identity_runtime"
          case "$SDK_GROUP" in
            aws) python -c "import boto3; import riswan_ir.connectors.cli" ;;
            azure) python -c "from azure.identity import WorkloadIdentityCredential; from azure.keyvault.keys.crypto import CryptographyClient; from azure.keyvault.secrets import SecretClient" ;;
            gcp) python -c "from google.auth import identity_pool; from google.cloud import kms, secretmanager" ;;
          esac
