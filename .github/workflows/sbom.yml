name: SBOM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Generate a CycloneDX SBOM for the installed app
        run: |
          python -m pip install --target "$RUNNER_TEMP/runtime-packages" .
          bash .github/scripts/install-scanner.sh syft
          "$RUNNER_TEMP/scanners/syft" scan "dir:$RUNNER_TEMP/runtime-packages" \
            --source-name RiswanIR --source-version "$GITHUB_SHA" \
            -o cyclonedx-json=riswan-ir.cdx.json
          python -c "import json; from pathlib import Path; data = json.loads(Path('riswan-ir.cdx.json').read_text()); assert {'pydantic', 'riswan-ir'} <= {component['name'].lower() for component in data['components']}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riswan-ir-sbom
          path: riswan-ir.cdx.json
          retention-days: 30
          if-no-files-found: error
