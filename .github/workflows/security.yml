name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 2"

permissions:
  contents: read

jobs:
  scan:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Prepare scan outputs
        run: mkdir -p reports "$RUNNER_TEMP/runtime-manifest"
      - name: Scan repository history for secrets
        run: |
          bash .github/scripts/install-scanner.sh gitleaks
          "$RUNNER_TEMP/scanners/gitleaks" git --redact=100 --no-banner \
            --report-format json --report-path reports/gitleaks.json .
      - name: Install Python scanners
        if: ${{ !cancelled() }}
        run: python -m pip install ".[security]"
      - name: Run Bandit
        if: ${{ !cancelled() }}
        run: python -m bandit -r src -ll -f json -o reports/bandit.json
      - name: Resolve runtime dependencies
        if: ${{ !cancelled() }}
        run: |
          python -m venv "$RUNNER_TEMP/runtime-env"
          "$RUNNER_TEMP/runtime-env/bin/python" -m pip install .
          "$RUNNER_TEMP/runtime-env/bin/python" -m pip list --format=freeze \
            --exclude sentinelforge --exclude pip --exclude setuptools \
            > "$RUNNER_TEMP/runtime-manifest/requirements.txt"
          cp "$RUNNER_TEMP/runtime-manifest/requirements.txt" reports/runtime-requirements.txt
      - name: Audit runtime dependencies with pip-audit
        if: ${{ !cancelled() }}
        run: |
          python -m pip_audit --no-deps --disable-pip -r "$RUNNER_TEMP/runtime-manifest/requirements.txt" \
            --format json --output reports/pip-audit.json
      - name: Audit high and critical vulnerabilities with Trivy
        if: ${{ !cancelled() }}
        run: |
          bash .github/scripts/install-scanner.sh trivy
          "$RUNNER_TEMP/scanners/trivy" fs --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --format json --output reports/trivy.json "$RUNNER_TEMP/runtime-manifest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: security-scan-reports
          path: reports/
          retention-days: 14
          if-no-files-found: error
