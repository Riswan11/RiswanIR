- id: "SF-AWS-IAM-001"
  name: "Suspicious cross-account role assumption"
  version: "1.0.0"
  enabled: true
  description: "Suspicious cross-account role assumption recorded in successful AWS activity."
  severity: "high"
  provider: "AWS"
  conditions: [{"field":"activity.service","operator":"in","value":["sts.amazonaws.com","sts.amazonaws.com.cn"]},{"field":"activity.operation","operator":"in","value":["AssumeRole","AssumeRoleWithSAML","AssumeRoleWithWebIdentity"]},{"field":"context.cross_account","operator":"equals","value":true},{"field":"context.role_privileged","operator":"equals","value":true},{"field":"context.environment","operator":"equals","value":"production"}]
  any_conditions: [{"field":"context.unseen_relationship","operator":"equals","value":true},{"field":"context.unexpected_network","operator":"equals","value":true}]
  suppression: {"window_minutes":30,"fields":["actor.uid","resource.uid"]}
  mitre: {"tactics":["privilege-escalation"],"techniques":["T1078.004"]}
  recommendation: "Review the evidence and validate the business justification for suspicious cross-account role assumption."

