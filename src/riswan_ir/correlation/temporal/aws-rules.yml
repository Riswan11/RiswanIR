- id: "SF-CORR-AWS-001"
  name: "Potential privileged account compromise"
  version: "1.0.0"
  enabled: true
  group_by: "lineage"
  window_minutes: 60
  suppression_minutes: 15
  stages:
    - {"name":"privileged_role","service":"sts","operations":["AssumeRole"],"conditions":[{"field":"context.role_privileged","operator":"equals","value":true}]}
    - {"name":"credential_created","service":"iam","operations":["CreateAccessKey"],"requires_chain":true}
    - {"name":"logging_disrupted","service":"cloudtrail","operations":["StopLogging","DeleteTrail"]}
  severity: "high"
  mitre: {"tactics":["privilege-escalation","persistence"],"techniques":["T1078.004","T1098.001"]}
  recommendation: "Review the linked evidence and verify the business justification for the activity."

- id: "SF-CORR-AWS-002"
  name: "Potential credential misuse and privilege escalation"
  version: "1.0.0"
  enabled: true
  group_by: "lineage"
  window_minutes: 45
  suppression_minutes: 15
  stages:
    - {"name":"credential_created","service":"iam","operations":["CreateAccessKey"]}
    - {"name":"privileged_role","service":"sts","operations":["AssumeRole"],"conditions":[{"field":"context.role_privileged","operator":"equals","value":true}],"requires_chain":true}
  severity: "high"
  mitre: {"tactics":["persistence","privilege-escalation"],"techniques":["T1098.001","T1078.004"]}
  recommendation: "Review the linked evidence and verify the business justification for the activity."

- id: "SF-CORR-AWS-003"
  name: "Cross-account lateral movement"
  version: "1.0.0"
  enabled: true
  group_by: "lineage"
  window_minutes: 60
  suppression_minutes: 15
  stages:
    - {"name":"privileged_role","service":"sts","operations":["AssumeRole"],"conditions":[{"field":"context.cross_account","operator":"equals","value":true}]}
    - {"name":"destination_activity","service":"iam","operations":["GetUser","ListUsers","CreateAccessKey"],"requires_chain":true}
  severity: "high"
  mitre: {"tactics":["privilege-escalation"],"techniques":["T1078.004"]}
  cross_account: true
  recommendation: "Review the linked evidence and verify the business justification for the activity."

- id: "SF-CORR-AWS-004"
  name: "Persistence through IAM modifications"
  version: "1.0.0"
  enabled: true
  group_by: "identity"
  window_minutes: 45
  suppression_minutes: 15
  stages:
    - {"name":"admin_policy_attached","service":"iam","operations":["AttachUserPolicy","AttachRolePolicy","AttachGroupPolicy"],"findings":["SF-AWS-PRIV-001"]}
    - {"name":"credential_created","service":"iam","operations":["CreateAccessKey"]}
  severity: "high"
  mitre: {"tactics":["persistence"],"techniques":["T1098.001"]}
  recommendation: "Review the linked evidence and verify the business justification for the activity."

- id: "SF-CORR-AWS-005"
  name: "Logging disruption followed by sensitive activity"
  version: "1.0.0"
  enabled: true
  group_by: "lineage"
  window_minutes: 30
  suppression_minutes: 15
  stages:
    - {"name":"logging_disrupted","service":"cloudtrail","operations":["StopLogging","DeleteTrail"]}
    - {"name":"sensitive_read","service":"s3","operations":["GetObject","SelectObjectContent"],"conditions":[{"field":"resource.criticality","operator":"in","value":["sensitive","critical"]}]}
  severity: "high"
  mitre: {"tactics":["collection"],"techniques":["T1530"]}
  recommendation: "Review the linked evidence and verify the business justification for the activity."

- id: "SF-CORR-AWS-006"
  name: "Potential S3 data collection or exfiltration"
  version: "1.0.0"
  enabled: true
  group_by: "resource"
  window_minutes: 20
  suppression_minutes: 15
  stages:
    - {"name":"sensitive_read","service":"s3","operations":["GetObject","SelectObjectContent"],"conditions":[{"field":"resource.criticality","operator":"in","value":["sensitive","critical"]}],"count":2}
    - {"name":"unexpected_network_read","service":"s3","operations":["GetObject"],"findings":["SF-AWS-DATA-001"]}
  severity: "high"
  mitre: {"tactics":["collection"],"techniques":["T1530"]}
  recommendation: "Review the linked evidence and verify the business justification for the activity."

- id: "SF-CORR-AWS-007"
  name: "Repeated authentication failures followed by success"
  version: "1.0.0"
  enabled: true
  group_by: "identity"
  window_minutes: 20
  suppression_minutes: 15
  stages:
    - {"name":"login_failed","service":"signin","operations":["ConsoleLogin"],"count":3,"outcomes":["failure"]}
    - {"name":"login_succeeded","service":"signin","operations":["ConsoleLogin"]}
  severity: "medium"
  mitre: {"tactics":["credential-access"],"techniques":["T1110"]}
  recommendation: "Review the linked evidence and verify the business justification for the activity."

- id: "SF-CORR-AWS-008"
  name: "Suspicious role chaining"
  version: "1.0.0"
  enabled: true
  group_by: "lineage"
  window_minutes: 30
  suppression_minutes: 15
  stages:
    - {"name":"first_role","service":"sts","operations":["AssumeRole"]}
    - {"name":"privileged_role","service":"sts","operations":["AssumeRole"],"conditions":[{"field":"context.unexpected_network","operator":"equals","value":true}],"requires_chain":true}
  severity: "high"
  mitre: {"tactics":["privilege-escalation"],"techniques":["T1078.004"]}
  recommendation: "Review the linked evidence and verify the business justification for the activity."

- id: "SF-CORR-AWS-009"
  name: "Potential unauthorized infrastructure provisioning"
  version: "1.0.0"
  enabled: true
  group_by: "identity"
  window_minutes: 45
  suppression_minutes: 15
  stages:
    - {"name":"admin_policy_attached","service":"iam","operations":["AttachUserPolicy","AttachRolePolicy","AttachGroupPolicy"],"findings":["SF-AWS-PRIV-001"]}
    - {"name":"unexpected_instance_creation","service":"ec2","operations":["RunInstances"],"findings":["SF-AWS-INFRA-002"]}
  severity: "high"
  mitre: {"tactics":["defense-impairment"],"techniques":["T1578.002"]}
  recommendation: "Review the linked evidence and verify the business justification for the activity."

- id: "SF-CORR-AWS-010"
  name: "Security control modification followed by resource access"
  version: "1.0.0"
  enabled: true
  group_by: "resource"
  window_minutes: 30
  suppression_minutes: 15
  stages:
    - {"name":"bucket_policy_changed","service":"s3","operations":["PutBucketPolicy"],"findings":["SF-AWS-DATA-003"]}
    - {"name":"object_read","service":"s3","operations":["GetObject"]}
  severity: "high"
  mitre: {"tactics":["collection"],"techniques":["T1530"]}
  recommendation: "Review the linked evidence and verify the business justification for the activity."
